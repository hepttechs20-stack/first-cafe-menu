<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - First Cafe Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { border-bottom: 2px solid #2c3e50; padding-bottom: 10px; margin-top: 0; color: #2c3e50; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 1rem; }
        button { background: #2c3e50; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 10px; font-weight: 600; }
        button:hover { opacity: 0.9; }
        .error-msg { color: #e74c3c; font-size: 0.9rem; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>First Cafe Portal</h2>
    <form id="login-form">
        <input type="email" id="email" placeholder="Admin Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>
    <div class="error-msg" id="error-message">Invalid email or password.</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

    // Your Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAHecBi1rAHRZLDvspa1P1P358LEqwF9kU",
        authDomain: "firstcafe.firebaseapp.com",
        projectId: "firstcafe",
        storageBucket: "firstcafe.firebasestorage.app",
        messagingSenderId: "695475447870",
        appId: "1:695475447870:web:25486f48051faa41fb096f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('login-form');
    const errorDiv = document.getElementById('error-message');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.style.display = 'none';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            // Check credentials against Firebase Auth
            await signInWithEmailAndPassword(auth, email, password);
            // Redirect to your admin page upon successful validation
            window.location.href = "admin.html"; 
        } catch (error) {
            console.error("Login failed:", error.message);
            errorDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
