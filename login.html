<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | First Cafe</title>
    <style>
        :root {
            --bg: #ffffff;
            --card-bg: #f9f9f9;
            --gold: #b8860b;
            --text: #1a1a1a;
            --border: #eee;
            --input-bg: #f0f0f0;
            --input-text: #1a1a1a;
            --btn-text: white;
        }

        .dark-mode {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --gold: #d4af37;
            --text: #f5f5f5;
            --border: #333;
            --input-bg: #262626;
            --input-text: white;
            --btn-text: #121212;
        }

        body {
            font-family: sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: 0.3s;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            box-sizing: border-box;
        }

        h2 { color: var(--gold); text-align: center; margin-bottom: 25px; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            background: var(--input-bg);
            color: var(--input-text);
            transition: 0.3s;
        }

        button {
            background: var(--gold);
            color: var(--btn-text);
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            font-size: 1rem;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .theme-btn-fixed {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--gold);
            color: var(--btn-text);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            z-index: 2000;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>First Cafe Admin</h2>
    <input type="email" id="email" placeholder="Admin Email" value="admin@firstcafe.com">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">SIGN IN</button>
    <div class="error-msg" id="error-box"></div>
</div>

<button class="theme-btn-fixed" onclick="toggleTheme()">🌓</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAHecBi1rAHRZLDvspa1P1P358LEqwF9kU",
        authDomain: "firstcafe.firebaseapp.com",
        projectId: "firstcafe",
        storageBucket: "firstcafe.firebasestorage.app",
        messagingSenderId: "695475447870",
        appId: "1:695475447870:web:25486f48051faa41fb096f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.toggleTheme = () => document.body.classList.toggle('dark-mode');

    window.login = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('error-box');
        
        errorBox.style.display = "none";

        try {
            await signInWithEmailAndPassword(auth, email, password);
            // On success, redirect to the admin panel
            window.location.href = "admin.html";
        } catch (error) {
            errorBox.innerText = "Invalid credentials. Please try again.";
            errorBox.style.display = "block";
        }
    };
</script>
</body>
</html>
