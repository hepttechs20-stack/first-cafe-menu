<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | First Cafe</title>
    <style>
        :root {
            --bg: #ffffff;
            --card-bg: #f9f9f9;
            --gold: #b8860b;
            --text: #1a1a1a;
            --border: #eee;
            --input-bg: #f0f0f0;
            --input-text: #1a1a1a;
            --btn-text: white;
            --action-btn-bg: #e0e0e0;
            --action-btn-text: #1a1a1a;
        }

        .dark-mode {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --gold: #d4af37;
            --text: #f5f5f5;
            --border: #333;
            --input-bg: #262626;
            --input-text: white;
            --btn-text: #121212;
            --action-btn-bg: #333;
            --action-btn-text: white;
        }

        body { 
            font-family: sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            transition: 0.3s;
            padding-bottom: 80px;
            display: none; /* Hidden until auth state checks out */
        }
        
        .form-card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 15px; 
            max-width: 500px; 
            margin: auto; 
            border: 1px solid var(--border); 
            transition: 0.3s;
            position: relative;
        }
        
        h2 { color: var(--gold); text-align: center; margin-bottom: 20px; }
        
        .logout-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            box-sizing: border-box; 
            background: var(--input-bg); 
            color: var(--input-text); 
            transition: 0.3s;
        }
        
        #save-btn { 
            background: var(--gold); 
            color: var(--btn-text); 
            border: none; 
            padding: 15px; 
            width: 100%; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 15px; 
        }
        
        .item-list { max-width: 500px; margin: 30px auto; }
        
        .list-card { 
            background: var(--card-bg); 
            padding: 15px; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-radius: 10px; 
            border-left: 4px solid var(--gold); 
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            transition: 0.3s;
        }
        
        .btn-group { display: flex; gap: 8px; }
        
        .edit-btn { 
            background: var(--action-btn-bg); 
            color: var(--action-btn-text); 
            border: none;
            border-radius: 4px;
            width: auto; 
            padding: 5px 12px; 
            margin: 0; 
            font-size: 0.8rem; 
            cursor: pointer;
        }
        
        .del-btn { 
            background: #e74c3c; 
            color: white; 
            border: none;
            border-radius: 4px;
            width: auto; 
            padding: 5px 12px; 
            margin: 0; 
            font-size: 0.8rem; 
            cursor: pointer;
        }
        
        #progress-container { width: 100%; height: 8px; background: var(--border); border-radius: 4px; display: none; margin: 10px 0; }
        #progress-bar { height: 100%; background: var(--gold); width: 0%; border-radius: 4px; }
        
        .theme-btn-fixed { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: var(--gold); 
            color: var(--btn-text); 
            border: none; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            cursor: pointer; 
            z-index: 2000; 
            font-size: 1.2rem; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>

<div class="form-card">
    <button class="logout-btn" onclick="logout()">LOGOUT</button>
    <h2 id="form-title">Menu Management</h2>
    <input type="hidden" id="edit-id">
    <input type="text" id="name_en" placeholder="Item Name (English)">
    <input type="text" id="name_am" placeholder="Item Name (Amharic)">
    <select id="main_category">
        <option value="Food">Food</option>
        <option value="Drink">Drink</option>
        <option value="Services">Services</option>
    </select>
    <input type="text" id="sub_category" placeholder="Sub-category (e.g., Pizza)">
    <input type="number" id="price" placeholder="Price (ETB)">
    <textarea id="ing_en" placeholder="Ingredients (English)"></textarea>
    <textarea id="ing_am" placeholder="Ingredients (Amharic)"></textarea>
    <input type="file" id="photo">
    <div id="progress-container"><div id="progress-bar"></div></div>
    <input type="hidden" id="current-img">
    <div style="margin: 10px 0;"><input type="checkbox" id="is_available" checked style="width:auto;"> Available in Stock</div>
    <button id="save-btn" onclick="saveItem()">SAVE ITEM</button>
</div>

<div class="item-list" id="item-list"></div>

<button class="theme-btn-fixed" onclick="toggleTheme()">🌓</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAHecBi1rAHRZLDvspa1P1P358LEqwF9kU",
        authDomain: "firstcafe.firebaseapp.com",
        projectId: "firstcafe",
        storageBucket: "firstcafe.firebasestorage.app",
        messagingSenderId: "695475447870",
        appId: "1:695475447870:web:25486f48051faa41fb096f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Security Gate: Ensure user is authorized to view this page
    onAuthStateChanged(auth, (user) => {
        if (user && user.email === "admin@firstcafe.com") {
            document.body.style.display = "block"; // Show page if authorized
        } else {
            window.location.href = "login.html"; // Redirect if unauthorized
        }
    });

    window.logout = () => {
        signOut(auth).then(() => {
            window.location.href = "login.html";
        });
    };

    window.toggleTheme = () => document.body.classList.toggle('dark-mode');

    window.saveItem = async () => {
        const file = document.getElementById('photo').files[0];
        const editId = document.getElementById('edit-id').value;
        let url = document.getElementById('current-img').value;

        if (file) {
            const storageRef = ref(storage, 'menu/' + Date.now() + "_" + file.name);
            const uploadTask = uploadBytesResumable(storageRef, file);
            document.getElementById('progress-container').style.display = 'block';
            
            await new Promise((resolve) => {
                uploadTask.on('state_changed', (snapshot) => {
                    document.getElementById('progress-bar').style.width = (snapshot.bytesTransferred / snapshot.totalBytes) * 100 + '%';
                }, null, async () => {
                    url = await getDownloadURL(uploadTask.snapshot.ref);
                    resolve();
                });
            });
        }

        const data = {
            name_en: document.getElementById('name_en').value,
            name_am: document.getElementById('name_am').value,
            main_category: document.getElementById('main_category').value,
            sub_category: document.getElementById('sub_category').value,
            price: Number(document.getElementById('price').value),
            ing_en: document.getElementById('ing_en').value,
            ing_am: document.getElementById('ing_am').value,
            image_url: url,
            is_available: document.getElementById('is_available').checked
        };

        if (editId) await updateDoc(doc(db, "menu_items", editId), data);
        else await addDoc(collection(db, "menu_items"), data);

        alert("Database Updated!");
        location.reload();
    };

    onSnapshot(collection(db, "menu_items"), (snap) => {
        const list = document.getElementById('item-list');
        list.innerHTML = "";
        snap.forEach(d => {
            const item = d.data();
            list.innerHTML += `<div class="list-card">
                <span>${item.name_en}</span>
                <div class="btn-group">
                    <button class="edit-btn" onclick="editMode('${d.id}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">Edit</button>
                    <button class="del-btn" onclick="deleteItem('${d.id}')">Del</button>
                </div>
            </div>`;
        });
    });

    window.editMode = (id, item) => {
        document.getElementById('edit-id').value = id;
        document.getElementById('name_en').value = item.name_en;
        document.getElementById('name_am').value = item.name_am;
        document.getElementById('main_category').value = item.main_category;
        document.getElementById('sub_category').value = item.sub_category;
        document.getElementById('price').value = item.price;
        document.getElementById('ing_en').value = item.ing_en;
        document.getElementById('ing_am').value = item.ing_am;
        document.getElementById('current-img').value = item.image_url;
        document.getElementById('is_available').checked = item.is_available;
        document.getElementById('save-btn').innerText = "UPDATE ITEM";
        window.scrollTo(0,0);
    };

    window.deleteItem = async (id) => { if(confirm("Permanently delete?")) await deleteDoc(doc(db, "menu_items", id)); };
</script>
</body>
</html>
