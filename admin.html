<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | First Cafe</title>
    <style>
        :root {
            --bg: #ffffff;
            --card-bg: #f9f9f9;
            --gold: #b8860b;
            --text: #1a1a1a;
            --border: #eee;
            --input-bg: #f0f0f0;
            --input-text: #1a1a1a;
            --btn-text: white;
            --action-btn-bg: #e0e0e0;
            --action-btn-text: #1a1a1a;
        }

        .dark-mode {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --gold: #d4af37;
            --text: #f5f5f5;
            --border: #333;
            --input-bg: #262626;
            --input-text: white;
            --btn-text: #121212;
            --action-btn-bg: #333;
            --action-btn-text: white;
        }

        body { 
            font-family: sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            transition: 0.3s;
            padding-bottom: 80px;
            display: none; 
        }
        
        .form-card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 15px; 
            max-width: 500px; 
            margin: auto; 
            border: 1px solid var(--border); 
            transition: 0.3s;
            position: relative;
        }
        
        h2 { color: var(--gold); text-align: center; margin-bottom: 20px; }
        
        .logout-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        /* "Add New Item instead" button hidden by default until edit mode runs */
        #new-item-toggle-btn {
            display: none;
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            margin: 0 auto 15px auto;
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            box-sizing: border-box; 
            background: var(--input-bg); 
            color: var(--input-text); 
            transition: 0.3s;
        }
        
        #save-btn { 
            background: var(--gold); 
            color: var(--btn-text); 
            border: none; 
            padding: 15px; 
            width: 100%; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 15px; 
        }
        
        .item-list { max-width: 500px; margin: 30px auto; }
        
        .list-card { 
            background: var(--card-bg); 
            padding: 15px; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-radius: 10px; 
            border-left: 4px solid var(--gold); 
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            transition: 0.3s;
        }
        
        .btn-group { display: flex; gap: 8px; }
        
        .edit-btn { 
            background: var(--action-btn-bg); 
            color: var(--action-btn-text); 
            border: none;
            border-radius: 4px;
            width: auto; 
            padding: 5px 12px; 
            margin: 0; 
            font-size: 0.8rem; 
            cursor: pointer;
        }
        
        .del-btn { 
            background: #e74c3c; 
            color: white; 
            border: none;
            border-radius: 4px;
            width: auto; 
            padding: 5px 12px; 
            margin: 0; 
            font-size: 0.8rem; 
            cursor: pointer;
        }
        
        .theme-btn-fixed { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: var(--gold); 
            color: var(--btn-text); 
            border: none; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            cursor: pointer; 
            z-index: 2000; 
            font-size: 1.2rem; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>

<div class="form-card">
    <button class="logout-btn" onclick="logout()">LOGOUT</button>
    <h2 id="form-title">Add New Menu Item</h2>
    
    <div style="text-align: center;">
        <button id="new-item-toggle-btn" onclick="clearToAddNewMode()">➕ Add New Item instead</button>
    </div>

    <input type="hidden" id="edit-id">
    <input type="text" id="name_en" placeholder="Item Name (English)">
    <input type="text" id="name_am" placeholder="Item Name (Amharic)">
    <select id="main_category">
        <option value="Food">Food</option>
        <option value="Drink">Drink</option>
        <option value="Services">Services</option>
    </select>
    <input type="text" id="sub_category" placeholder="Sub-category (e.g., Pizza)">
    <input type="number" id="price" placeholder="Price (ETB)">
    <textarea id="ing_en" placeholder="Ingredients (English)"></textarea>
    <textarea id="ing_am" placeholder="Ingredients (Amharic)"></textarea>
    
    <input type="text" id="image_url_input" placeholder="Paste Image Direct URL Link (e.g., https://site.com/image.jpg)">
    
    <div style="margin: 10px 0;"><input type="checkbox" id="is_available" checked style="width:auto;"> Available in Stock</div>
    <button id="save-btn" onclick="saveItem()">SAVE ITEM</button>
</div>

<div class="item-list" id="item-list"></div>

<button class="theme-btn-fixed" onclick="toggleTheme()">🌓</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAHecBi1rAHRZLDvspa1P1P358LEqwF9kU",
        authDomain: "firstcafe.firebaseapp.com",
        projectId: "firstcafe",
        storageBucket: "firstcafe.firebasestorage.app",
        messagingSenderId: "695475447870",
        appId: "1:695475447870:web:25486f48051faa41fb096f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
        if (user && user.email === "admin@firstcafe.com") {
            document.body.style.display = "block";
        } else {
            window.location.href = "login.html";
        }
    });

    window.logout = () => {
        signOut(auth).then(() => { window.location.href = "login.html"; });
    };

    window.toggleTheme = () => document.body.classList.toggle('dark-mode');

    window.clearToAddNewMode = () => {
        document.getElementById('edit-id').value = "";
        document.getElementById('name_en').value = "";
        document.getElementById('name_am').value = "";
        document.getElementById('main_category').value = "Food";
        document.getElementById('sub_category').value = "";
        document.getElementById('price').value = "";
        document.getElementById('ing_en').value = "";
        document.getElementById('ing_am').value = "";
        document.getElementById('image_url_input').value = "";
        document.getElementById('is_available').checked = true;
        
        document.getElementById('form-title').innerText = "Add New Menu Item";
        document.getElementById('save-btn').innerText = "SAVE ITEM";
        document.getElementById('new-item-toggle-btn').style.display = "none";
    };

    window.saveItem = async () => {
        const editId = document.getElementById('edit-id').value;
        const imgUrl = document.getElementById('image_url_input').value;

        const data = {
            name_en: document.getElementById('name_en').value,
            name_am: document.getElementById('name_am').value,
            main_category: document.getElementById('main_category').value,
            sub_category: document.getElementById('sub_category').value,
            price: Number(document.getElementById('price').value),
            ing_en: document.getElementById('ing_en').value,
            ing_am: document.getElementById('ing_am').value,
            image_url: imgUrl,
            is_available: document.getElementById('is_available').checked
        };

        if (editId) {
            await updateDoc(doc(db, "menu_items", editId), data);
            alert("Item Updated Successfully!");
        } else {
            await addDoc(collection(db, "menu_items"), data);
            alert("New Item Added Successfully!");
        }
        clearToAddNewMode();
    };

    onSnapshot(collection(db, "menu_items"), (snap) => {
        const list = document.getElementById('item-list');
        list.innerHTML = "";
        snap.forEach(d => {
            const item = d.data();
            list.innerHTML += `<div class="list-card">
                <span>${item.name_en}</span>
                <div class="btn-group">
                    <button class="edit-btn" onclick="editMode('${d.id}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">Edit</button>
                    <button class="del-btn" onclick="deleteItem('${d.id}')">Del</button>
                </div>
            </div>`;
        });
    });

    window.editMode = (id, item) => {
        document.getElementById('edit-id').value = id;
        document.getElementById('name_en').value = item.name_en;
        document.getElementById('name_am').value = item.name_am;
        document.getElementById('main_category').value = item.main_category;
        document.getElementById('sub_category').value = item.sub_category;
        document.getElementById('price').value = item.price;
        document.getElementById('ing_en').value = item.ing_en;
        document.getElementById('ing_am').value = item.ing_am;
        document.getElementById('image_url_input').value = item.image_url;
        document.getElementById('is_available').checked = item.is_available;
        
        document.getElementById('form-title').innerText = "Update Item Entry";
        document.getElementById('save-btn').innerText = "UPDATE ITEM CHANGES";
        document.getElementById('new-item-toggle-btn').style.display = "inline-block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteItem = async (id) => { if(confirm("Permanently delete?")) await deleteDoc(doc(db, "doc", id)); };
</script>
</body>
</html>
