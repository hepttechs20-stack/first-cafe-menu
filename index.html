<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Cafe | Digital Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --gold: #d4af37;
            --text: #f5f5f5;
            --border: #333;
            --input-bg: #1a1a1a;
            --modal-overlay: rgba(0,0,0,0.9);
        }

        .light-mode {
            --bg: #ffffff;
            --card-bg: #f9f9f9;
            --gold: #b8860b;
            --text: #1a1a1a;
            --border: #eee;
            --input-bg: #f0f0f0;
            --modal-overlay: rgba(255,255,255,0.95);
        }

        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg); color: var(--text); transition: 0.3s; padding-bottom: 50px; }

        /* Slider Styles */
        .slider-container { width: 100%; height: 200px; overflow: hidden; position: relative; border-bottom: 2px solid var(--gold); }
        .slider { display: flex; width: 300%; height: 100%; animation: slide 12s infinite ease-in-out; }
        .slider img { width: 33.33%; height: 100%; object-fit: cover; }
        @keyframes slide {
            0% { transform: translateX(0); }
            33% { transform: translateX(-33.33%); }
            66% { transform: translateX(-66.66%); }
            100% { transform: translateX(0); }
        }

        /* Brand Text Overlay Style */
        .slider-overlay-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 0 10px 0;
            text-align: center;
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-weight: 700;
            /* Gradient background ensures readability against light images */
            background: linear-gradient(to top, rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0));
            z-index: 10;
            pointer-events: none; /* Allows clicks to pass through if necessary */
        }

        header { padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; background: var(--bg); border-bottom: 1px solid var(--border); }
        
        .top-nav { display: flex; justify-content: flex-end; align-items: center; padding: 0 10px; }
        .nav-right { display: flex; gap: 15px; align-items: center; }
        .control-link { color: var(--gold); cursor: pointer; font-size: 0.75rem; font-weight: 600; }

        .search-area { padding: 10px 15px; display: flex; justify-content: center; }
        #search { width: 100%; max-width: 350px; padding: 10px 20px; border-radius: 20px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); outline: none; }

        .tabs { display: flex; overflow-x: auto; padding: 10px 15px; gap: 10px; scrollbar-width: none; justify-content: center; }
        .tab { cursor: pointer; padding: 6px 15px; border-radius: 20px; font-size: 0.8rem; border: 1px solid var(--border); color: #888; }
        .tab.active { color: var(--bg); background: var(--gold); border-color: var(--gold); }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .item-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; }
        .item-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .item-info { padding: 10px; }
        .price { color: var(--gold); font-weight: 700; font-size: 0.9rem; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-overlay); z-index: 3000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; overflow: hidden; border: 1px solid var(--gold); position: relative; }
        .modal-img { width: 100%; height: 250px; object-fit: cover; }
        .modal-body { padding: 20px; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: var(--gold); color: #000; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; }

        .theme-btn-fixed { position: fixed; bottom: 20px; right: 20px; background: var(--gold); color: #000; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; z-index: 2000; font-size: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="light-mode">

<div class="slider-container">
    <div class="slider">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=1000&auto=format&fit=crop" alt="Slide 1">
        <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=1000&auto=format&fit=crop" alt="Slide 2">
        <img src="https://images.unsplash.com/photo-1559496417-e7f25bc247f3?q=80&w=1000&auto=format&fit=crop" alt="Slide 3">
    </div>
    <div class="slider-overlay-text">FIRST CAFE</div>
</div>

<header>
    <div class="top-nav">
        <div class="nav-right">
            <span class="control-link" onclick="toggleCurrency()" id="curr-label">ETB</span>
            <span class="control-link" onclick="toggleLang()" id="lang-label">EN</span>
        </div>
    </div>
</header>

<div class="search-area">
    <input type="text" id="search" placeholder="Search menu..." onkeyup="renderItems()">
</div>

<div class="tabs">
    <div class="tab active" onclick="setMainCat('All', this)">All</div>
    <div class="tab" onclick="setMainCat('Food', this)">Food</div>
    <div class="tab" onclick="setMainCat('Drink', this)">Drink</div>
</div>

<div class="menu-grid" id="menu-display"></div>

<button class="theme-btn-fixed" onclick="toggleTheme()">🌓</button>

<div id="itemModal" class="modal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeModal()">×</button>
        <img id="modal-img" class="modal-img" src="">
        <div class="modal-body">
            <h2 id="modal-title" style="margin: 0; color: var(--gold);"></h2>
            <p id="modal-price" class="price" style="font-size: 1.2rem; margin: 10px 0;"></p>
            <h4 style="margin-bottom: 5px;">Ingredients:</h4>
            <p id="modal-ingredients" style="font-size: 0.9rem; color: #aaa;"></p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAHecBi1rAHRZLDvspa1P1P358LEqwF9kU",
        authDomain: "firstcafe.firebaseapp.com",
        projectId: "firstcafe",
        storageBucket: "firstcafe.firebasestorage.app",
        messagingSenderId: "695475447870",
        appId: "1:695475447870:web:25486f48051faa41fb096f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let items = [];
    let currentMain = 'All';
    let lang = 'en';
    let currency = 'ETB';
    const rate = 0.0085;

    onSnapshot(collection(db, "menu_items"), (snap) => {
        items = snap.docs.map(d => d.data());
        renderItems();
    });

    window.toggleTheme = () => document.body.classList.toggle('light-mode');
    window.toggleLang = () => { lang = lang === 'en' ? 'am' : 'en'; document.getElementById('lang-label').innerText = lang.toUpperCase(); renderItems(); };
    window.toggleCurrency = () => { currency = currency === 'ETB' ? 'USD' : 'ETB'; document.getElementById('curr-label').innerText = currency; renderItems(); };
    window.setMainCat = (cat, el) => { currentMain = cat; document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); renderItems(); };

    window.renderItems = () => {
        const display = document.getElementById('menu-display');
        display.innerHTML = "";
        const searchVal = document.getElementById('search').value.toLowerCase();
        
        let filtered = items.filter(i => {
            const match = (currentMain === 'All' || i.main_category === currentMain);
            return match && (i.name_en.toLowerCase().includes(searchVal) || i.name_am.includes(searchVal));
        });

        filtered.forEach((item, index) => {
            let p = currency === 'ETB' ? item.price : (item.price * rate).toFixed(2);
            let name = lang === 'en' ? item.name_en : item.name_am;
            let ing = lang === 'en' ? item.ing_en : item.ing_am;
            
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openModal(item, p, name, ing);
            card.innerHTML = `
                <img src="${item.image_url}" class="item-img">
                <div class="item-info">
                    <h3>${name}</h3>
                    <div class="price">${p} ${currency}</div>
                </div>`;
            display.appendChild(card);
        });
    };

    window.openModal = (item, price, name, ing) => {
        document.getElementById('modal-img').src = item.image_url;
        document.getElementById('modal-title').innerText = name;
        document.getElementById('modal-price').innerText = price + " " + currency;
        document.getElementById('modal-ingredients').innerText = ing || "No ingredients listed.";
        document.getElementById('itemModal').style.display = 'flex';
    };

    window.closeModal = () => document.getElementById('itemModal').style.display = 'none';

    window.onclick = (event) => {
        const modal = document.getElementById('itemModal');
        if (event.target == modal) closeModal();
    };
</script>
</body>
</html>
